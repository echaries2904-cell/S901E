name: Build Samsung S901E Kernel (KSU Next + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh | bash

      - name: Add 16GB Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip bc bison flex g++-multilib gcc-multilib libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z1-dev libxml2-utils xsltproc unzip

      - name: Integrate KernelSU Next & SUSFS
        run: |
          chmod -R +x .
          
          # Xác định vị trí kernel common của Samsung
          KDIR="kernel_platform/common"
          if [ ! -d "$KDIR" ]; then
            KDIR="common"
          fi

          if [ -d "$KDIR" ]; then
            cd $KDIR
            
            # 1. Tải KernelSU-Next
            curl -LSs "https://raw.githubusercontent.com/rifs28/KernelSU-Next/next/kernel/setup.sh" | bash -s next-susfs || true
            
            # 2. Tải SUSFS patch cho GKI Android 12 (Kernel 5.10)
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs_src || true

            # 3. Copy file susfs vào nguồn kernel Samsung
            cp susfs_src/kernel_patches/fs/susfs.c ./fs/ || true
            cp susfs_src/kernel_patches/include/linux/susfs.h ./include/linux/ || true
            
            # 4. Apply Patch SUSFS cho Kernel 5.10
            patch -p1 < susfs_src/kernel_patches/5.10/50_add_susfs_in_gki-android12-5.10.patch || true

            # 5. Bật các cờ SUSFS vào gki_defconfig của Samsung
            DEFCONFIG="./arch/arm64/configs/gki_defconfig"
            if [ -f "$DEFCONFIG" ]; then
              echo "CONFIG_KSU=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_SU=y" >> $DEFCONFIG
            fi
          fi

      - name: Build Samsung Kernel
        run: |
          bash build_kernel_GKI.sh

      - name: Package Output Image
        run: |
          mkdir -p out_artifact
          find . -name "Image*" -type f -exec cp {} out_artifact/ \; || true

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S901E-KernelSU-Next-SUSFS
          path: out_artifact/*
