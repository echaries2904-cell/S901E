name: Build GKI Kernel with KernelSU Next + SUSFS

on:
  workflow_dispatch:
    inputs:
      ksu_susfs:
        description: "Include KernelSU Next + SUSFS"
        type: boolean
        default: true
  push:
    branches: [ "main" ]
    paths:
      - "kernel_platform/**"
      - ".github/workflows/build.yml"

env:
  # ---- ADJUST THESE TO MATCH YOUR REPO ----
  KERNEL_ROOT: kernel_platform/common      # folder with the top-level Makefile
  DEFCONFIG_PATH: kernel_platform/common/arch/arm64/configs/gki_defconfig  # adjust filename
  SUSFS_BRANCH: gki-android13-5.10          # S901E Snapdragon, Android 14 firmware (S901EXXUBEXK5) — kernel stays 5.10, no android14-5.10 branch exists
  CCACHE_DIR: /home/runner/.ccache

  # ---- PINNED COMPATIBLE COMMITS (do NOT use the "next" HEAD branch — it has
  #      drifted from KernelSU upstream and breaks the SUSFS patch, see
  #      https://github.com/KernelSU-Next/KernelSU-Next/issues/426) ----
  KSU_NEXT_COMMIT: 300a13f657754339a294c08909e9851936f47ba9
  # SUSFS commit matching SUSFS_BRANCH above:
  #   gki-android12-5.10 -> ed9a1ee64e1886ee2c0288f1c91e33558465993c
  #   gki-android13-5.10 -> e891cdfa40c40e78bb20a3f5acf4d2e8149e3a7d  (in use)
  SUSFS_COMMIT: e891cdfa40c40e78bb20a3f5acf4d2e8149e3a7d

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ---------------------------------------------------------------
      # 1. Free up disk space (GKI builds need 30-50GB+)
      # ---------------------------------------------------------------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h

      # ---------------------------------------------------------------
      # 2. Checkout your repo
      # ---------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # ---------------------------------------------------------------
      # 3. Install build dependencies
      # ---------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf libncurses-dev libssl-dev \
            python3 python3-pip rsync unzip zip zlib1g-dev \
            libelf-dev dwarves lz4 device-tree-compiler

      - name: Setup ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # ---------------------------------------------------------------
      # 4. Add KernelSU Next (pinned to a commit known to work with SUSFS —
      #    do NOT track the "next" branch HEAD, see note in env: above)
      # ---------------------------------------------------------------
      - name: Add KernelSU Next
        if: ${{ inputs.ksu_susfs != false }}
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e
          # Let the official installer clone the repo and wire it into
          # drivers/Makefile + drivers/Kconfig (this part is safe to keep
          # tracking upstream), THEN pin the checkout to the known-good commit.
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s next
          cd KernelSU-Next
          git fetch --depth=1 origin ${{ env.KSU_NEXT_COMMIT }}
          git checkout ${{ env.KSU_NEXT_COMMIT }}
          cd ..
          echo "KSU_GIT_VERSION=$(cd KernelSU-Next && git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 5. Clone SUSFS (pinned commit matching the KSU-Next commit above)
      #    and apply patches
      # ---------------------------------------------------------------
      - name: Clone SUSFS4KSU
        if: ${{ inputs.ksu_susfs != false }}
        run: |
          git clone -b ${{ env.SUSFS_BRANCH }} \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          cd susfs4ksu
          git checkout ${{ env.SUSFS_COMMIT }}

      - name: Apply SUSFS kernel patch
        if: ${{ inputs.ksu_susfs != false }}
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e
          PATCH_FILE=$(find ../../susfs4ksu/kernel_patches -maxdepth 1 -name "50_add_susfs_in_*.patch" | head -n1)
          echo "Using patch: $PATCH_FILE"
          cp ../../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp ../../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          patch -p1 --fuzz=3 < "$PATCH_FILE"
          if find . -name "*.rej" | grep -q .; then
            echo "::error::Rejected hunks found - SUSFS_COMMIT/SUSFS_BRANCH likely doesn't match this kernel base"
            find . -name "*.rej" -exec cat {} \;
            exit 1
          fi

      - name: Apply SUSFS patch to KernelSU Next
        if: ${{ inputs.ksu_susfs != false }}
        working-directory: ${{ env.KERNEL_ROOT }}/KernelSU-Next
        run: |
          patch -p1 --fuzz=3 < ../../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          if find . -name "*.rej" | grep -q .; then
            echo "::error::Rejected hunks found - KSU_NEXT_COMMIT/SUSFS_COMMIT pin is out of sync, see env: block"
            find . -name "*.rej" -exec cat {} \;
            exit 1
          fi

      # ---------------------------------------------------------------
      # 6. Enable required config symbols in defconfig
      # ---------------------------------------------------------------
      - name: Patch defconfig
        run: |
          set -e
          CONF="${{ env.DEFCONFIG_PATH }}"
          if [ ! -f "$CONF" ]; then
            echo "::error::Defconfig not found at $CONF - update DEFCONFIG_PATH in the workflow env"
            exit 1
          fi
          cat >> "$CONF" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          EOF

      # ---------------------------------------------------------------
      # 7. Build using your existing script
      # ---------------------------------------------------------------
      - name: Build kernel
        run: |
          # GitHub web-upload strips the executable bit from shell scripts,
          # so restore +x on every script the build chain calls before running.
          find . -type f -name "*.sh" -exec chmod +x {} +
          find . -type f -name "*.py" -exec chmod +x {} +
          chmod +x build_kernel_GKI.sh
          ./build_kernel_GKI.sh

      # ---------------------------------------------------------------
      # 8. Locate build output
      # ---------------------------------------------------------------
      - name: Find kernel Image
        id: find_image
        run: |
          set -e
          IMG=$(find . -type f \( -name "Image" -o -name "Image.gz" -o -name "Image.gz-dtb" \) | head -n1)
          if [ -z "$IMG" ]; then
            echo "::error::Could not locate a built kernel Image"
            exit 1
          fi
          echo "image_path=$IMG" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # 9. Package with AnyKernel3
      # ---------------------------------------------------------------
      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          cp "${{ steps.find_image.outputs.image_path }}" anykernel/Image
          cd anykernel
          zip -r9 ../S901E-KernelSU-Next-SUSFS-$(date +%Y%m%d-%H%M).zip . -x ".git*"

      # ---------------------------------------------------------------
      # 10. Upload artifact
      # ---------------------------------------------------------------
      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: S901E-KernelSU-Next-SUSFS
          path: "*.zip"
          retention-days: 14

      - name: Upload raw Image (debug)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-raw
          path: ${{ steps.find_image.outputs.image_path }}
          retention-days: 7
