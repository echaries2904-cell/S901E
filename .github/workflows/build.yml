name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y zip bc bison flex libssl-dev libelf-dev \
            build-essential python3 rsync cpio kmod lz4 unzip device-tree-compiler

      - name: Build Samsung Kernel
        run: |
          mkdir -p out/target/product/r0q/tmp
          mkdir -p kernel_platform/out/target/product/r0q/tmp
          chmod -R +x .
          bash ./build_kernel_GKI.sh

      - name: Package AnyKernel3
        run: |
          IMG=$(find kernel_platform/out/ -name "Image" -o -name "Image.gz" | head -n1)
          if [ -z "$IMG" ]; then
            echo "Build failed: Image not found!"
            exit 1
          fi
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel
          cp "$IMG" AnyKernel/Image
          
          ZIP_NAME="S22-S901E-KernelSU-SUSFS.zip"
          zip -r "$ZIP_NAME" AnyKernel/*
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S22-Kernel-Output
          path: S22-S901E-KernelSU-SUSFS.zip
          retention-days: 7
