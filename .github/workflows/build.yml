name: Build GKI Kernel with KernelSU Next + SUSFS

on:
  workflow_dispatch:
    inputs:
      ksu_susfs:
        description: "Include KernelSU Next + SUSFS"
        type: boolean
        default: true
  push:
    branches: [ "main" ]
    paths:
      - "kernel_platform/**"
      - ".github/workflows/build.yml"

env:
  # ---- ADJUST THESE TO MATCH YOUR REPO ----
  KERNEL_ROOT: kernel_platform/common      # folder with the top-level Makefile[cite: 1]
  DEFCONFIG_PATH: kernel_platform/common/arch/arm64/configs/gki_defconfig  # adjust filename[cite: 1]
  SUSFS_BRANCH: gki-android13-5.10          # S901E Snapdragon, Android 14 firmware (S901EXXUBEXK5) — kernel stays 5.10, no android14-5.10 branch exists[cite: 1]
  CCACHE_DIR: /home/runner/.ccache[cite: 1]

  # ---- SUSFS commit for the kernel-side patch (KernelSU side now comes
  #      pre-integrated from pershoot/KernelSU-Next's next-susfs branch,
  #      see step 4) ----[cite: 1]
  SUSFS_COMMIT: e891cdfa40c40e78bb20a3f5acf4d2e8149e3a7d[cite: 1]

jobs:
  build:
    runs-on: ubuntu-22.04[cite: 1]
    timeout-minutes: 360[cite: 1]

    steps:
      # ---------------------------------------------------------------
      # 1. Free up disk space (GKI builds need 30-50GB+)[cite: 1]
      # ---------------------------------------------------------------
      - name: Free disk space[cite: 1]
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup[cite: 1]
          sudo docker image prune --all --force[cite: 1]
          df -h[cite: 1]

      # ---------------------------------------------------------------
      # 2. Checkout your repo[cite: 1]
      # ---------------------------------------------------------------
      - name: Checkout source[cite: 1]
        uses: actions/checkout@v4[cite: 1]
        with:
          fetch-depth: 1[cite: 1]
          submodules: recursive[cite: 1]

      # ---------------------------------------------------------------
      # 3. Install build dependencies[cite: 1]
      # ---------------------------------------------------------------
      - name: Install dependencies[cite: 1]
        run: |
          sudo apt-get update[cite: 1]
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf libncurses-dev libssl-dev \
            python3 python3-pip rsync unzip zip zlib1g-dev \
            libelf-dev dwarves lz4 device-tree-compiler[cite: 1]

      - name: Setup ccache[cite: 1]
        run: |
          mkdir -p "$CCACHE_DIR"[cite: 1]
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"[cite: 1]

      - name: Cache ccache[cite: 1]
        uses: actions/cache@v4[cite: 1]
        with:
          path: ${{ env.CCACHE_DIR }}[cite: 1]
          key: ccache-${{ runner.os }}-${{ github.ref_name }}[cite: 1]
          restore-keys: |
            ccache-${{ runner.os }}-[cite: 1]

      # ---------------------------------------------------------------
      # 4. Add KernelSU Next — using the pershoot/KernelSU-Next fork's
      #    "next-susfs" branch, which already has SUSFS hooks pre-merged.
      # ---------------------------------------------------------------
      - name: Add KernelSU Next (SUSFS-integrated fork)[cite: 1]
        if: ${{ inputs.ksu_susfs != false }}[cite: 1]
        working-directory: ${{ env.KERNEL_ROOT }}[cite: 1]
        run: |
          set -e[cite: 1]
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/next-susfs/kernel/setup.sh" \
            | bash -s next-susfs[cite: 1]
          echo "KSU_GIT_VERSION=$(cd KernelSU-Next && git rev-list --count HEAD)" >> "$GITHUB_ENV"[cite: 1]

      # ---------------------------------------------------------------
      # 5. Clone SUSFS & apply kernel patch[cite: 1]
      # ---------------------------------------------------------------
      - name: Clone SUSFS4KSU[cite: 1]
        if: ${{ inputs.ksu_susfs != false }}[cite: 1]
        run: |
          git clone -b ${{ env.SUSFS_BRANCH }} \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu[cite: 1]
          cd susfs4ksu[cite: 1]
          git checkout ${{ env.SUSFS_COMMIT }}[cite: 1]

      - name: Apply SUSFS kernel patch[cite: 1]
        if: ${{ inputs.ksu_susfs != false }}[cite: 1]
        working-directory: ${{ env.KERNEL_ROOT }}[cite: 1]
        run: |
          set -e[cite: 1]
          PATCH_FILE=$(find ../../susfs4ksu/kernel_patches -maxdepth 1 -name "50_add_susfs_in_*.patch" | head -n1)[cite: 1]
          echo "Using patch: $PATCH_FILE"[cite: 1]
          cp ../../susfs4ksu/kernel_patches/fs/susfs.c fs/[cite: 1]
          cp ../../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/[cite: 1]
          cp ../../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/[cite: 1]
          patch -p1 --fuzz=3 < "$PATCH_FILE"[cite: 1]
          if find . -name "*.rej" | grep -q .; then[cite: 1]
            echo "::error::Rejected hunks found - SUSFS_COMMIT/SUSFS_BRANCH likely doesn't match this kernel base"[cite: 1]
            find . -name "*.rej" -exec cat {} \;[cite: 1]
            exit 1[cite: 1]
          fi[cite: 1]

      # ---------------------------------------------------------------
      # 6. Enable required config symbols in defconfig[cite: 1]
      # ---------------------------------------------------------------
      - name: Patch defconfig[cite: 1]
        run: |
          set -e[cite: 1]
          CONF="${{ env.DEFCONFIG_PATH }}"[cite: 1]
          if [ ! -f "$CONF" ]; then[cite: 1]
            echo "::error::Defconfig not found at $CONF - update DEFCONFIG_PATH in the workflow env"[cite: 1]
            exit 1[cite: 1]
          fi[cite: 1]
          cat >> "$CONF" <<'EOF'[cite: 1]
          CONFIG_KSU=y[cite: 1]
          CONFIG_KSU_SUSFS=y[cite: 1]
          CONFIG_KSU_SUSFS_SUS_PATH=y[cite: 1]
          CONFIG_KSU_SUSFS_SUS_MOUNT=y[cite: 1]
          CONFIG_KSU_SUSFS_SUS_KSTAT=y[cite: 1]
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y[cite: 1]
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y[cite: 1]
          CONFIG_KSU_SUSFS_ENABLE_LOG=y[cite: 1]
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y[cite: 1]
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y[cite: 1]
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y[cite: 1]
          CONFIG_KPROBES=y[cite: 1]
          CONFIG_HAVE_KPROBES=y[cite: 1]
          CONFIG_KPROBE_EVENTS=y[cite: 1]
          EOF[cite: 1]

      # ---------------------------------------------------------------
      # 7. Build using your existing script
      # ---------------------------------------------------------------
      - name: Build kernel[cite: 1]
        run: |
          set -e
          
          # 1. Tạo sẵn thư mục tạm r0q/tmp để tránh lỗi mktemp No such file or directory
          mkdir -p out/target/product/r0q/tmp
          mkdir -p kernel_platform/out/target/product/r0q/tmp

          # 2. Cấp quyền thực thi cho TẤT CẢ các file script/mã nguồn (bao gồm cả build/brunch)
          find . -type f -exec chmod +x {} + 2>/dev/null || true

          # 3. Thực thi script build
          chmod +x build_kernel_GKI.sh[cite: 1]
          ./build_kernel_GKI.sh[cite: 1]

      # ---------------------------------------------------------------
      # 8. Locate build output[cite: 1]
      # ---------------------------------------------------------------
      - name: Find kernel Image[cite: 1]
        id: find_image[cite: 1]
        run: |
          set -e[cite: 1]
          IMG=$(find . -type f \( -name "Image" -o -name "Image.gz" -o -name "Image.gz-dtb" \) | head -n1)[cite: 1]
          if [ -z "$IMG" ]; then[cite: 1]
            echo "::error::Could not locate a built kernel Image"[cite: 1]
            exit 1[cite: 1]
          fi[cite: 1]
          echo "image_path=$IMG" >> "$GITHUB_OUTPUT"[cite: 1]

      # ---------------------------------------------------------------
      # 9. Package with AnyKernel3[cite: 1]
      # ---------------------------------------------------------------
      - name: Package with AnyKernel3[cite: 1]
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel[cite: 1]
          rm -rf anykernel/.git[cite: 1]
          cp "${{ steps.find_image.outputs.image_path }}" anykernel/Image[cite: 1]
          cd anykernel[cite: 1]
          zip -r9 ../S901E-KernelSU-Next-SUSFS-$(date +%Y%m%d-%H%M).zip . -x ".git*"[cite: 1]

      # ---------------------------------------------------------------
      # 10. Upload artifact[cite: 1]
      # ---------------------------------------------------------------
      - name: Upload flashable zip[cite: 1]
        uses: actions/upload-artifact@v4[cite: 1]
        with:
          name: S901E-KernelSU-Next-SUSFS[cite: 1]
          path: "*.zip"[cite: 1]
          retention-days: 14[cite: 1]

      - name: Upload raw Image (debug)[cite: 1]
        uses: actions/upload-artifact@v4[cite: 1]
        with:
          name: kernel-image-raw[cite: 1]
          path: ${{ steps.find_image.outputs.image_path }}[cite: 1]
          retention-days: 7[cite: 1]
