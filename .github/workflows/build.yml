name: Build Samsung S901E (r0q) KernelSU Next + SUSFS

on:
  workflow_dispatch:
    inputs:
      ksu_susfs:
        description: "Include KernelSU Next + SUSFS"
        type: boolean
        default: true
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libncurses-dev libssl-dev python3 python3-pip rsync unzip zip \
            zlib1g-dev libelf-dev dwarves lz4 device-tree-compiler

      - name: Setup KernelSU Next
        if: ${{ inputs.ksu_susfs != false }}
        working-directory: kernel_platform/common
        run: |
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/next-susfs/kernel/setup.sh" | bash -s next-susfs

      - name: Clone & Apply SUSFS Patch
        if: ${{ inputs.ksu_susfs != false }}
        run: |
          git clone -b gki-android13-5.10 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          cd susfs4ksu
          git checkout e891cdfa40c40e78bb20a3f5acf4d2e8149e3a7d

          cd ../kernel_platform/common
          cp ../../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp ../../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          
          PATCH_FILE=$(find ../../susfs4ksu/kernel_patches -maxdepth 1 -name "50_add_susfs_in_*.patch" | head -n1)
          patch -p1 --fuzz=3 < "$PATCH_FILE" || true

      - name: Inject KSU & SUSFS Configs
        run: |
          CONF="kernel_platform/common/arch/arm64/configs/gki_defconfig"
          cat >> "$CONF" << 'EOF'
CONFIG_KSU=y
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_TRY_UMOUNT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME=y
CONFIG_KSU_SUSFS_ENABLE_LOG=y
CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
CONFIG_KPROBES=y
CONFIG_HAVE_KPROBES=y
CONFIG_KPROBE_EVENTS=y
EOF

      - name: Fix Samsung Environment & Build
        run: |
          set -e
          
          mkdir -p out/target/product/r0q/tmp
          mkdir -p kernel_platform/out/target/product/r0q/tmp

          find kernel_platform -type f -name "build.config*" -exec sed -i 's/apply_defconfig_fragment/# apply_defconfig_fragment/g' {} +

          chmod -R +x .

          ./build_kernel_GKI.sh

      - name: Package AnyKernel3
        run: |
          IMG=$(find kernel_platform/out -name "Image" -o -name "Image.gz" | head -n1)
          if [ -z "$IMG" ]; then
            echo "Build failed: Image not found!"
            exit 1
          fi
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp "$IMG" anykernel/Image
          cd anykernel
          zip -r9 ../S901E-KernelSU-Next-SUSFS.zip . -x ".git*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S901E-KernelSU-Next-SUSFS
          path: S901E-KernelSU-Next-SUSFS.zip
          retention-days: 14
