name: Build KernelSU Next + SUSFS (r0q S901E)

on:
  workflow_dispatch:
    inputs:
      ksu_susfs:
        description: "Build with KernelSU Next + SUSFS"
        type: boolean
        default: true
  push:
    branches: [ "main" ]
    paths:
      - "kernel_platform/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libncurses-dev libssl-dev python3 python3-pip rsync unzip zip \
            zlib1g-dev libelf-dev dwarves lz4 device-tree-compiler libssl-dev

      - name: Setup KernelSU Next (next-susfs)
        if: ${{ inputs.ksu_susfs != false }}
        working-directory: kernel_platform/common
        run: |
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/next-susfs/kernel/setup.sh" | bash -s next-susfs

      - name: Clone & Patch SUSFS
        if: ${{ inputs.ksu_susfs != false }}
        run: |
          git clone -b gki-android13-5.10 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          cd susfs4ksu
          git checkout e891cdfa40c40e78bb20a3f5acf4d2e8149e3a7d

          cd ../kernel_platform/common
          cp ../../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp ../../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          
          PATCH_FILE=$(find ../../susfs4ksu/kernel_patches -maxdepth 1 -name "50_add_susfs_in_*.patch" | head -n1)
          patch -p1 --fuzz=3 < "$PATCH_FILE" || true

      - name: Patch Defconfig
        run: |
          CONF="kernel_platform/common/arch/arm64/configs/gki_defconfig"
          cat >> "$CONF" <<'EOF'
CONFIG_KSU=y
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_TRY_UMOUNT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME=y
CONFIG_KSU_SUSFS_ENABLE_LOG=y
CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
CONFIG_KPROBES=y
CONFIG_HAVE_KPROBES=y
CONFIG_KPROBE_EVENTS=y
EOF

      - name: Build Kernel (BruhDudeWew Method)
        run: |
          set -e
          # Cấp quyền cho toàn bộ thư mục build
          chmod -R +x kernel_platform/build/
          chmod -R +x kernel_platform/tools/
          
          # Thiết lập môi trường build
          export ROOT_DIR=$(pwd)
          export KERNEL_KIT=$ROOT_DIR/kernel_platform
          
          # Gọi trực tiếp build.sh của Qualcomm/Android
          cd kernel_platform
          
          # Khai báo biến môi trường cho Waipio (Snapdragon 8 Gen 1)
          export LTO=thin
          export BUILD_CONFIG=msm-kernel/build.config.msm.waipio
          
          # Thực thi build
          ./build/build.sh

      - name: Find & Package Output
        run: |
          IMG=$(find kernel_platform/out -name "Image" -o -name "Image.gz" | head -n1)
          if [ -z "$IMG" ]; then
            echo "Build failed: Image not found!"
            exit 1
          fi
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp "$IMG" anykernel/Image
          cd anykernel
          zip -r9 ../S901E-KernelSU-Next-SUSFS-r0q.zip . -x ".git*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S901E-KernelSU-Next-SUSFS
          path: S901E-KernelSU-Next-SUSFS-r0q.zip
          retention-days: 14
