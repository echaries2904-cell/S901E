name: Patch & Build Samsung S901E Kernel (KSU Next + SuSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev git ccache zip mold patch

      # BƯỚC VÁ CÁC HOOK VÀ MÃ NGUỒN VÀO KERNEL SAMSUNG STOCK
      - name: Setup KernelSU Next & Apply Hooks
        run: |
          # 1. Tải KernelSU Next v3.3.0
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.3.0

          # 2. Clone SuSFS repo (bản GKI Android 12 Kernel 5.10)
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs

          # 3. Copy file nguồn SuSFS vào Virtual File System (fs) & Header Kernel
          cp susfs/kernel_patches/fs/* fs/
          cp susfs/kernel_patches/include/linux/* include/linux/

          # 4. Patch SuSFS Hooks vào VFS Kernel 5.10 của Samsung (chèn hook vfs_read, vfs_stat, vfs_open...)
          patch -p1 < susfs/kernel_patches/5.10/5.10_susfs.patch || true

          # 5. Hook SuSFS trực tiếp vào mã nguồn KernelSU Next
          cd drivers/kernelsu
          patch -p1 < ../../susfs/kernel_patches/KernelSU/next/ksu_next_susfs.patch || true
          cd ../..

          # 6. Bật flag cấu hình KSU Next và SuSFS vào defconfig của Samsung
          DEFCONFIG_PATH="arch/arm64/configs/vendor/s901e_defconfig" # Kiểm tra lại đúng đường dẫn file defconfig của bạn
          echo "" >> $DEFCONFIG_PATH
          echo "# KernelSU Next & SuSFS Configs" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU_NEXT=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU_SUSFS_SUS_SU=y" >> $DEFCONFIG_PATH

      - name: Download Toolchain (AOSP Clang)
        run: |
          mkdir -p toolchain
          cd toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784d.tar.gz
          tar -xzf clang-r450784d.tar.gz
          cd ..

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_COMPAT=arm-linux-androideabi-

          make O=out vendor/s901e_defconfig
          make -j$(nproc) O=out

      - name: Pack AnyKernel3 Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
          cp out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image AnyKernel3/
          
          cd AnyKernel3
          zip -r9 ../S901E-KernelSU-SuSFS.zip * -x .git* README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S901E-KernelSU-SuSFS
          path: S901E-KernelSU-SuSFS.zip
